- id: current_salary
  operation: entity_read
  utterances:
    - What is my current salary?
    - How much do I earn right now?
    - What salary do you have saved for me?
  negatives:
    - utterance: What is the average salary for a Python developer?
      operation: none
    - utterance: Explain how salaries are benchmarked.
      operation: knowledge_read
      store: knowledge
- id: past_decision
  operation: episode_read
  store: episode
  utterances:
    - What did we decide last April?
    - Remind me what we agreed on in April.
    - What was our decision from April?
  negatives:
    - utterance: What should we decide today?
      operation: none
    - utterance: Give me a new recommendation for this year.
      operation: none
- id: general_knowledge
  operation: knowledge_read
  store: knowledge
  utterances:
    - How does a SIP work?
    - Explain systematic investment plans.
    - What is the basic idea behind investing through a SIP?
  negatives:
    - utterance: What did I tell you about my SIP last week?
      operation: episode_read
      store: episode
    - utterance: Which investment plan did I choose?
      operation: episode_read
      store: episode
- id: entity_update
  operation: entity_update_and_episode_write
  utterances:
    - I just changed jobs to TCS.
    - I now work at TCS.
    - "Update this: my new employer is TCS."
  negatives:
    - utterance: What is TCS?
      operation: knowledge_read
      store: knowledge
    - utterance: Find general information about TCS.
      operation: knowledge_read
      store: knowledge
- id: standing_rule
  operation: procedural_write
  utterances:
    - Never recommend equity to me again.
    - Going forward, don't suggest stocks for me.
    - "Please remember as a rule: do not recommend equity."
  negatives:
    - utterance: What is equity investing?
      operation: none
    - utterance: Compare equity funds with debt funds.
      operation: knowledge_read
      store: knowledge
    - utterance: Forget the rule about Aditya.
      operation: memory_forget
- id: inferred_pattern
  operation: pattern_read
  store: pattern
  utterances:
    - I'm worried about market volatility.
    - I feel uneasy when markets swing this much.
    - Market fluctuations are making me nervous.
  negatives:
    - utterance: Define market volatility.
      operation: knowledge_read
      store: knowledge
    - utterance: Show today's market volatility data.
      operation: none
- id: forget_memory
  operation: memory_forget
  utterances:
    - Forget the rule about Aditya.
    - Delete what you know about Aditya.
    - Remove that memory.
    - Clear my TCS info.
  negatives:
    - utterance: Never message Aditya on WhatsApp again.
      operation: procedural_write
    - utterance: Don't suggest stocks for me from now on.
      operation: procedural_write
    - utterance: Always ask before changing my calendar.
      operation: procedural_write
    - utterance: Delete the email draft.
      operation: none
    - utterance: Run echo hello in the VS Code terminal.
      operation: none
    - utterance: Change the text to hello from Arya.
      operation: none
